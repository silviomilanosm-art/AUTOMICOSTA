name: Build AUTOMICOSTA APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore stable AUTOMICOSTA debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: automicosta-debug-signing-key-v1

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AUTOMICOSTA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTOMICOSTA-APK
          path: AUTOMICOSTA.apk

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete automicosta-latest --cleanup-tag -y || true
          gh release create automicosta-latest AUTOMICOSTA.apk \
            --title "AUTOMICOSTA ultima versione" \
            --notes "APK aggiornato automaticamente dall'ultima compilazione riuscita." \
            --latest
