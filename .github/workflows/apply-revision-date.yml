name: Apply revision date field

on:
  push:
    paths:
      - 'revision-date.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app sources
        run: python tools/apply_revision_date.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/automicosta/app/data/Models.kt \
                  app/src/main/java/com/automicosta/app/data/AutoMiCostaDatabase.kt \
                  app/src/main/java/com/automicosta/app/data/AutoMiCostaBackupManager.kt \
                  app/src/main/java/com/automicosta/app/ui/AutoMiCostaApp.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add vehicle revision date section"
            git push origin HEAD:main
          fi
